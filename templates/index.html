<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Control Panel</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body x-data="otpPanel()" x-init="init()" :data-theme="dark ? 'dark' : 'light'">

    <div class="topbar">
        <span class="topbar-title">OTP Control Panel</span>
        <label class="theme-toggle" title="Toggle dark mode" @click="dark = !dark">
            <span x-text="dark ? 'Dark' : 'Light'"></span>
            <div class="toggle-track"></div>
        </label>
    </div>

    <div class="dashboard-container">

        <div class="panel-left">
            <h2>Servo Controls</h2>

            <template x-if="configLoaded === true">
                <div>
                    <template x-for="token in tokens" :key="token.id">
                        <details class="servo-details" name="servo-accordion" @toggle="onAccordionToggle($event)">

                            <summary class="servo-summary" x-text="servoLabel(token)"></summary>

                            <div class="servo-body">

                                <div class="servo-field" x-data="{ dirty: false }">
                                    <div class="field-label">
                                        Angle (°)
                                        <span class="unsaved" x-show="dirty" style="display: none;">*</span>
                                    </div>
                                    <div class="servo-controls">
                                        <input type="number" :value="angles[token.id]" min="1" max="180"
                                            @input="dirty = Number($el.value) !== angles[token.id]; onAngleInput($event)"
                                            @blur="if(saveAngleOnBlur($event, token.id)) dirty = false">
                                        <button class="btn-set" @click="testServo($el, token.id)">TRY</button>
                                    </div>
                                </div>

                                <div class="servo-field" x-data="{ dirty: false }">
                                    <div class="field-label">
                                        Name
                                        <span class="unsaved" x-show="dirty" style="display: none;">*</span>
                                    </div>
                                    <div class="servo-controls">
                                        <input type="text" class="meta-input name-input" :value="token.displayName"
                                            @input="dirty = $el.value.trim() !== (token.displayName || ''); onNameInput($event)">
                                        <button class="btn-set"
                                            @click="if(saveName($el, token)) dirty = false">Set</button>
                                    </div>
                                </div>

                                <div class="servo-field" x-data="{ dirty: false }">
                                    <div class="field-label">
                                        Aliases
                                        <span class="unsaved" x-show="dirty" style="display: none;">*</span>
                                    </div>
                                    <div class="servo-controls">
                                        <input type="text" class="meta-input alias-input"
                                            placeholder="e.g. woori, wr, wuri" :value="token.aliasString"
                                            @input="dirty = $el.value.trim() !== (token.aliasString || ''); onAliasInput($event)">
                                        <button class="btn-set"
                                            @click="if(saveAliases($el, token)) dirty = false">Set</button>
                                    </div>
                                </div>

                                <label class="toggle-row">
                                    <input type="checkbox" :checked="reTriggers[token.id]"
                                        @change="onReTriggerChange($event, token.id)">
                                    Re-trigger after capture
                                </label>

                            </div>
                        </details>
                    </template>
                </div>
            </template>
            <div x-show="configLoaded !== true" style="font-size:13px; color:var(--text-muted);">
                <span x-text="configLoaded === 'error' ? 'Failed to load config.' : 'Loading...'"></span>
            </div>

            <hr class="section-divider">
            <h2 style="margin-top:0">Camera Config</h2>

            <template x-for="side in SIDES" :key="side">
                <div class="servo-group">
                    <div class="servo-name" x-text="side.charAt(0).toUpperCase() + side.slice(1) + ' (ID)'"></div>
                    <div class="servo-controls">
                        <input type="number" :value="cameras[side]" min="0" max="3" @input="onCamIdInput($event)">
                        <button class="btn-set" @click="saveCamera($el, side)">Set</button>
                    </div>
                </div>
            </template>

            <div class="servo-group">
                <div class="servo-name">Delay (ms)</div>
                <div class="servo-controls">
                    <input type="number" :value="captureDelay" min="1000" max="5000" @input="onDelayInput($event)">
                    <button class="btn-set" @click="saveCaptureDelay($el)">Set</button>
                </div>
            </div>

            <p style="margin-top: auto; font-size: 11px; color: var(--text-muted);">
                &copy; yuan-miranda
            </p>
        </div>

        <div class="panel-right">
            <div class="grid-2x2">

                <div class="stream-box">
                    <div class="stream-header">
                        <span x-text="camLabel('left')"></span>
                        <button class="stream-btn" :class="{ closed: !camOpen.left }"
                            x-text="camOpen.left ? 'Close' : 'Open'" @click="toggleCamera('left')">
                        </button>
                    </div>
                    <img :src="camSrc.left" @error="setCamClosed('left')" x-show="camOpen.left">
                    <div class="cam-offline-overlay" :class="{ visible: !camOpen.left }">Camera offline</div>
                </div>

                <div class="stream-box">
                    <div class="stream-header">
                        <span x-text="camLabel('right')"></span>
                        <button class="stream-btn" :class="{ closed: !camOpen.right }"
                            x-text="camOpen.right ? 'Close' : 'Open'" @click="toggleCamera('right')">
                        </button>
                    </div>
                    <img :src="camSrc.right" @error="setCamClosed('right')" x-show="camOpen.right">
                    <div class="cam-offline-overlay" :class="{ visible: !camOpen.right }">Camera offline</div>
                </div>

                <div class="stream-box">
                    <div class="stream-header">
                        <span>Latest Capture</span>
                        <button class="stream-btn" @click="reloadCapture()">↻ Reload</button>
                    </div>
                    <img :src="latestSrc" :style="captureMissing ? 'visibility:hidden' : ''"
                        @error="captureMissing = true; capturePolling = false"
                        @load="captureMissing = false; capturePolling = true">
                    <div class="cam-offline-overlay" :class="{ visible: captureMissing }">No capture</div>
                </div>

                <div class="empty-slot"></div>
            </div>
        </div>

    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
